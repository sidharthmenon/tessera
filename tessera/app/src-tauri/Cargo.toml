[package]
name = "tessera-app"
version = "0.1.0"
description = "Tessera controller"
edition = "2024"

[lib]
# Distinct from the bin name (cargo#8519). Desktop only, so no staticlib/cdylib.
name = "tessera_app_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tessera-show = { path = "../../crates/show" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
getrandom = "0.4"
tokio = { version = "1", features = ["time", "sync", "macros", "net"] }
# Remote control (Companion, scripts): HTTP + WebSocket on the LAN, off unless turned on.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query", "json"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tauri-plugin-single-instance = "2"
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Process-lifetime "no App Nap" activity (stay_responsive in lib.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString"] }

# EcoQoS opt-out (stay_responsive in lib.rs); stopping an adopted engine (engine_client.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
