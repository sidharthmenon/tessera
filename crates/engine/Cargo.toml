[package]
name = "tessera-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tessera-show = { path = "../show" }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
pollster = "1"
uuid = { version = "1", features = ["v4"] }
wgpu = "30"
winit = "0.30"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSResponder", "NSView", "NSWindow"] }
